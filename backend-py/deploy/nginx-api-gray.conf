# ============================================================================
#  CWFLY 后端灰度切流（Node :3000 与 Python :3001 并存）
#  用法：把 upstream 段放到 http{} 内；把 location 段放进现有 server{} 内。
#  原则：只按「路径前缀」切，一次只切一批；每批切完做逐接口响应 diff。
# ============================================================================

# ---- 放在 http {} 内 ----
upstream cwfly_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream cwfly_py {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ---- 放在 server {} 内（顺序重要：更具体的写到前面）----

# 【阶段 1】只切 auth（P0/P1 验证：登录/注册/续签/me）
location ^~ /api/auth/ {
    proxy_pass http://cwfly_py;
    include /etc/nginx/cwfly-proxy.params;
}

# 【阶段 2】切飞行计划（含 FSD 管理口交互）
# location ^~ /api/flightplans/ {
#     proxy_pass http://cwfly_py;
#     include /etc/nginx/cwfly-proxy.params;
# }

# 【阶段 3】切气象与活动
# location ^~ /api/weather/ { proxy_pass http://cwfly_py; include /etc/nginx/cwfly-proxy.params; }
# location ^~ /api/events/  { proxy_pass http://cwfly_py; include /etc/nginx/cwfly-proxy.params; }

# 【阶段 4】其余业务（除 admin/socket.io 外）
# location ^~ /api/ { proxy_pass http://cwfly_py; include /etc/nginx/cwfly-proxy.params; }

# 【阶段 5】管理后台
# location ^~ /api/admin/ { proxy_pass http://cwfly_py; include /etc/nginx/cwfly-proxy.params; }

# 默认仍回 Node（灰度期间必须保留）
location /api/ {
    proxy_pass http://cwfly_node;
    include /etc/nginx/cwfly-proxy.params;
}

# Socket.IO 本期仍由 Node 提供（P3 迁移后改指 cwfly_py，路径不变）
location /socket.io/ {
    proxy_pass http://cwfly_node;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
}

